name: Seyr yayın bekçisi

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 saatte bir
  workflow_dispatch:
  push:
    paths:
      - "seyr/cams.js"
      - ".github/seyr/**"
      - ".github/workflows/seyr-bekci.yml"

permissions:
  contents: write

concurrency:
  group: seyr-bekci
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yayınları kontrol et
        run: python .github/seyr/bekci.py
      - name: Durumu kaydet
        run: |
          git config user.name "seyr-bekci"
          git config user.email "seyr-bekci@users.noreply.github.com"
          git add seyr/status.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Seyr: yayın durumu güncellendi"
          git pull --rebase
          git push
