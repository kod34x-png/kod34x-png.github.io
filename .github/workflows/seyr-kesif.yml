name: Seyr keşif

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/seyr/kesif.py"
      - ".github/workflows/seyr-kesif.yml"

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Açık kamera kaynaklarını tara
        run: python .github/seyr/kesif.py
      - name: Adayları kaydet
        run: |
          git config user.name "seyr-bekci"
          git config user.email "seyr-bekci@users.noreply.github.com"
          git add .github/seyr/adaylar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Seyr: kamera adayları tarandı"
          git pull --rebase
          git push
