<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seyr — Dünyayı canlı izle</title>
  <meta name="description" content="Dünyanın meydanlarını, sahillerini ve şehirlerini şu an, canlı izle.">
  <meta name="theme-color" content="#0E1A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seyr">
  <meta property="og:title" content="Seyr — Dünyayı canlı izle">
  <meta property="og:description" content="Dünyanın meydanlarını şu an, canlı izle.">
  <meta property="og:image" content="https://kod34x-png.github.io/seyr/icons/og.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" aria-label="Harita">
    <div id="map" aria-hidden="true"></div>

    <header class="brand">
      <div>
        <h1 class="wordmark">Seyr</h1>
        <p class="live-line" id="liveLine"></p>
      </div>
      <button class="lang" id="langBtn" type="button" aria-label="Dili değiştir">EN</button>
    </header>

    <section class="sheet" aria-label="Yerler">
      <button class="go" id="goRandom" type="button"></button>
      <div class="chips" id="chips" role="tablist"></div>
      <div class="strip" id="strip"></div>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <div id="player" hidden>
    <div class="feed" id="feed"></div>
    <nav class="topbar" aria-label="Gezinme">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Geri">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar-title" id="topTitle"></div>
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Haritaya dön">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.3 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.3-3.8-8.5s1.2-6.1 3.8-8.5z"/></svg>
      </button>
    </nav>
    <div class="hint" id="hint" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="cams.js"></script>
  <script src="app.js"></script>
</body>
</html>
